<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot the Fake</title>
<style>
:root{--bg:#eaf2f6;--card:#ffffff;--ink:#17324d;--muted:#52687c;--line:#c5d5e0;--accent:#f2b84b;--accent-ink:#2a1d00;--good:#2f9e6e;--good-bg:#dcf3e8;--soft:#fdecc8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10202e;--card:#1a3045;--ink:#eaf2f8;--muted:#a5b9ca;--line:#35506a;--accent:#f2b84b;--accent-ink:#2a1d00;--good:#4cc790;--good-bg:#164634;--soft:#3a3016;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10202e;--card:#1a3045;--ink:#eaf2f8;--muted:#a5b9ca;--line:#35506a;--accent:#f2b84b;--accent-ink:#2a1d00;--good:#4cc790;--good-bg:#164634;--soft:#3a3016;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0}
.screen{display:none}.screen.on{display:block}
.hero{text-align:center;padding:36px 8px}
.hero h1{font-size:clamp(40px,11vw,60px)}
.hero p{max-width:30ch;margin:14px auto 24px;color:var(--muted);font-size:19px}
.scale{width:96px;height:80px;margin:0 auto 6px;display:block}
button{font:inherit;cursor:pointer}
.btn{min-height:52px;padding:12px 28px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;font-weight:600}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.topic{color:var(--muted);font-size:15px;margin:0 0 4px}
.q{font-size:24px;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:14px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px}
.opt .tag{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt.wrong{opacity:.45;border-style:dashed;cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good);animation:pop .5s ease}
.opt.right .tag{background:var(--good);color:#fff}
.opt:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.msg{min-height:26px;margin:14px 2px 6px;font-weight:600}
.why{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--good);border-radius:12px;padding:12px 14px;margin:6px 0 14px;display:none}
.why.on{display:block}
.why b{display:block;margin-bottom:2px}
.burst{position:fixed;left:50%;top:40%;pointer-events:none}
.burst i{position:absolute;width:10px;height:10px;border-radius:50%;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
.end{text-align:center;padding:28px 8px}
.end h2{font-size:34px}
.big{font-size:64px;font-family:Georgia,serif;font-weight:700;margin:10px 0 0}
.end p{color:var(--muted);margin:8px auto 22px;max-width:32ch}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
@media (prefers-reduced-motion:reduce){.opt.right{animation:none}.burst{display:none}}
</style>
</head>
<body>
<main>
<section id="start" class="screen on hero">
<svg class="scale" viewBox="0 0 96 80" aria-hidden="true"><g fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"><path d="M48 12v58M30 72h36M16 24h64"/><path d="M16 24L6 48h20zM80 24L70 48h20z" fill="var(--accent)"/></g><circle cx="48" cy="12" r="6" fill="var(--ink)"/></svg>
<h1>Spot the Fake</h1>
<p>Three statements about the NY ethics rules are true. Find the fake together.</p>
<button class="btn" id="go">Start</button>
<div class="foot">For fun, not legal advice. Check the current NY Rules of Professional Conduct.</div>
</section>

<section id="play" class="screen">
<div class="bar"><span class="pill" id="rd">Round 1 of 8</span><span class="pill" id="sc">Score 0 (goal 6)</span></div>
<p class="topic" id="topic"></p>
<h2 class="q">Which one is the fake?</h2>
<div class="opts" id="opts"></div>
<div class="msg" id="msg" aria-live="polite"></div>
<div class="why" id="why"></div>
<button class="btn" id="next" style="display:none">Next round</button>
</section>

<section id="end" class="screen end">
<h2 id="endt"></h2>
<div class="big" id="endn"></div>
<p id="endp"></p>
<button class="btn" id="again">Play again</button>
</section>
</main>

<script>
var ROUNDS=[
{t:"Keeping secrets (Rule 1.6)",f:"A lawyer may share a client’s secrets with a friend if the friend promises not to tell.",
 r:["A lawyer may reveal a client’s confidential information when the client gives informed consent.","A lawyer may reveal confidential information to prevent reasonably certain death or substantial bodily harm.","A lawyer may reveal confidential information as needed to defend against a charge of wrongdoing by the lawyer."],
 w:"A friend’s promise is not an exception. Confidential information can only be shared under the rules’ listed exceptions."},
{t:"Fees (Rules 1.5 and 5.4)",f:"A lawyer may split a fee with a nonlawyer who sends clients, as long as it is disclosed.",
 r:["A lawyer generally may not share legal fees with a nonlawyer.","A lawyer may not charge a contingent fee in a criminal defense matter.","A lawyer may not charge a contingent fee to win a divorce."],
 w:"Fee sharing with nonlawyers is generally barred, with a few narrow exceptions. Disclosure does not fix it."},
{t:"Client money (Rule 1.15)",f:"A lawyer may borrow from the client trust account if the money is paid back by month end.",
 r:["Client money must be kept in a separate account from the lawyer’s own money.","A lawyer must promptly tell a client when the lawyer receives funds for that client.","A lawyer must keep trust account records for seven years."],
 w:"Client funds are never the lawyer’s to borrow, even briefly. That is called commingling or conversion."},
{t:"Advertising (Rule 7.1)",f:"A lawyer’s ad may guarantee a result if the lawyer feels confident about the case.",
 r:["A lawyer’s ad may not be false or misleading.","A lawyer’s ad generally must be labeled “Attorney Advertising.”","A lawyer must keep a copy of each ad for at least three years."],
 w:"No ad may guarantee a result. Confidence does not change that."},
{t:"Conflicts (Rules 1.7 and 1.8)",f:"A lawyer may buy the media rights to a client’s story while the case is still going.",
 r:["A lawyer may not begin a sexual relationship with a current client.","A lawyer who does a business deal with a client needs written consent and a chance for the client to get independent advice.","A lawyer may represent clients with a conflict only with informed consent confirmed in writing, and a reasonable belief the work will not suffer."],
 w:"Acquiring media rights to a client’s story during the case is a conflict the rules prohibit."},
{t:"Who decides (Rules 1.2 and 1.4)",f:"A lawyer may settle a case without telling the client if the lawyer thinks it is a good deal.",
 r:["The client decides whether to accept a settlement.","In a criminal case, the client decides whether to testify.","A lawyer must keep the client reasonably informed about the case."],
 w:"The client makes the settlement decision, so the lawyer must communicate any offer."},
{t:"Honesty to the court (Rule 3.3)",f:"A lawyer may let a client lie on the stand if the client insists.",
 r:["A lawyer may not knowingly offer false evidence to a court.","A lawyer who learns a witness lied must take reasonable steps to fix it.","A lawyer must disclose controlling case law against the client if the other side missed it."],
 w:"A client’s insistence never permits false testimony. The lawyer must act to correct it."},
{t:"Witnesses and evidence (Rule 3.4)",f:"A lawyer may hide a harmful document when the other side asks for it in discovery.",
 r:["A lawyer may pay a witness’s reasonable expenses to attend.","A lawyer may not pay a witness a fee that depends on the outcome of the case.","A lawyer may not threaten criminal charges just to gain an advantage in a civil matter."],
 w:"Hiding or destroying evidence a party is entitled to is prohibited, even if it hurts the case."}
];
var $=function(i){return document.getElementById(i)};
var deck,idx,score,locked;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["start","play","end"].forEach(function(s){$(s).className=(s==="end"?"screen end":(s==="start"?"screen hero":"screen"))+(s===id?" on":"")})}
function begin(){deck=shuffle(ROUNDS);idx=0;score=0;show("play");round()}
function status(){$("rd").textContent="Round "+(idx+1)+" of "+deck.length;$("sc").textContent="Score "+score+" (goal 6)"}
function round(){
 var r=deck[idx],first=true,items=shuffle([{s:r.f,fake:true}].concat(r.r.map(function(x){return{s:x,fake:false}})));
 locked=false;status();$("topic").textContent=r.t;$("msg").textContent="Talk it over, then tap the fake.";$("why").className="why";$("next").style.display="none";
 var box=$("opts");box.innerHTML="";
 items.forEach(function(it,n){
  var b=document.createElement("button");b.className="opt";
  b.innerHTML='<span class="tag">'+"ABCD".charAt(n)+'</span><span></span>';b.lastChild.textContent=it.s;
  b.onclick=function(){
   if(locked)return;
   if(it.fake){
    locked=true;b.className="opt right";if(first){score++}
    $("msg").textContent=first?"Yes! That is the fake. +1 for the team.":"Got it. No point this round, but you found it.";
    $("why").innerHTML="<b>Why it is false</b>";$("why").appendChild(document.createTextNode(r.w));$("why").className="why on";
    status();burst();
    Array.prototype.forEach.call(box.children,function(c){c.disabled=true});
    $("next").textContent=(idx===deck.length-1)?"See results":"Next round";$("next").style.display="inline-block";
   }else{
    first=false;b.className="opt wrong";b.disabled=true;$("msg").textContent="Not quite. That one is true. Try again.";
   }
  };
  box.appendChild(b);
 });
}
function burst(){
 var d=document.createElement("div");d.className="burst";var cols=["#f2b84b","#2f9e6e","#e2725b","#5aa9e6"];
 for(var i=0;i<14;i++){var p=document.createElement("i"),a=i/14*6.283,k=60+Math.random()*50;
  p.style.setProperty("--x",Math.cos(a)*k+"px");p.style.setProperty("--y",Math.sin(a)*k+"px");p.style.background=cols[i%4];d.appendChild(p)}
 document.body.appendChild(d);setTimeout(function(){d.remove()},1000);
}
function finish(){
 show("end");var win=score>=6,n=deck.length;
 $("endt").textContent=win?"The team wins!":"So close!";
 $("endn").textContent=score+" / "+n;
 $("endp").textContent=win?"You spotted the fake on the first tap in "+score+" rounds. Nicely done.":"The goal was 6. You got "+score+". Another game deals the rounds in a new order.";
}
$("go").onclick=begin;$("again").onclick=begin;
$("next").onclick=function(){if(idx===deck.length-1){finish()}else{idx++;round()}};
</script>
</body>
</html>
